name: Windows build and test

# Personal Wiki (desktop) targets Windows 11. This workflow is the real proof:
# it builds and tests the whole stack — Rust core, CLI, Tauri app, Svelte
# frontend — on an actual Windows runner, and produces the NSIS/MSI installer
# as an artifact. The desktop app lives in desktop/, alongside a separate
# Next.js/Cloudflare web app at the repository root; this workflow only
# touches desktop/.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Install Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the frontend
        run: pnpm check

      - name: Unit test the frontend (Vitest)
        run: pnpm test

      - name: Test the Rust workspace (core + CLI)
        run: cargo test --workspace --exclude personal-wiki-app --verbose

      - name: Validate the Knowledge Pack schema against every seed pack
        shell: bash
        run: |
          set -e
          npm install --no-save ajv@8 ajv-formats@3
          for f in seed/starter-pack.json seed/packs/*.json; do
            echo "validating $f"
            node -e "
              const Ajv = require('ajv/dist/2020');
              const addFormats = require('ajv-formats');
              const fs = require('fs');
              const ajv = new Ajv({ allErrors: true, strict: false });
              addFormats(ajv);
              const schema = JSON.parse(fs.readFileSync('schemas/knowledge-pack.schema.json', 'utf8'));
              const validate = ajv.compile(schema);
              const pack = JSON.parse(fs.readFileSync('$f', 'utf8'));
              if (!validate(pack)) { console.error(validate.errors); process.exit(1); }
              console.log('  ok');
            "
          done

      - name: Build the frontend
        run: pnpm build:only

      - name: Build the Windows Tauri application (release, NSIS + MSI)
        run: pnpm tauri build --bundles nsis,msi

      - name: Locate build artifacts
        id: artifacts
        shell: bash
        run: |
          echo "bundle_dir=src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"
          find src-tauri/target/release/bundle -maxdepth 2 -type f \( -iname '*.exe' -o -iname '*.msi' \) -print

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: personal-wiki-windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate E2E fixtures from the real core
        run: cargo run -p pw-cli --example dev_fixtures -- tests/e2e/fixtures/api.json

      - name: Run the Playwright E2E suite
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: desktop/playwright-report/
          retention-days: 14
