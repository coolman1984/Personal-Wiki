[workspace]
resolver = "2"
members = ["crates/pw-core", "crates/pw-cli", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
pw-core = { path = "crates/pw-core" }
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
